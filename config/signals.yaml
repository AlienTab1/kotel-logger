  device_class: temperature
  state_class: measurement
s_t_akus:
  name: Akumulace uprostřed
  type: number
  prometheus: true
  publish: true
  unit_of_measurement: °C
  device_class: temperature
  state_class: measurement
s_t_akud:
  name: Akumulace dole
  type: number
  prometheus: true
