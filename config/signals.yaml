# Neznámé signály zůstávají v posledním diagnostickém snapshotu; nevytváří metriky ani entity.
# prometheus: true publikuje číselnou metriku; publish: true samostatně zapíná HA entitu.
# Fyzický význam booleanů a jejich polaritu nejprve ověřte.
s_t_spal:
  name: Spaliny
  type: number
  prometheus: true
  publish: true
  unit_of_measurement: °C
  device_class: temperature
  state_class: measurement
