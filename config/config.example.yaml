# Kopírujte jako config.yaml. Hesla patří do secrets / proměnných prostředí.
data_dir: /data
signals_file: signals.yaml
thematronic:
  url: https://jbr1.thematronic.cz
  device_id: 2985
  poll_s: 15
  mode: read_only # reload_then_read až po živém ověření
  reload_wait_s: 2 # pouze výchozí prodleva, NE garance čerstvosti
  timeout_s: 15
  max_response_bytes: 1048576
session:
  expected_session_lifetime_s: null # neznámá; ruční kalibrace dle README
  cooldown_s: 300
  quick_relog_s: 30
  tolerance_s: 60
  early_loss_s: 120
  ambiguous_403_pause_s: 900
queue:
  max_items: 100000 # vzorky + události; první dosažený limit rozhoduje
  max_bytes: 268435456 # 256 MiB serializovaných payloadů, nikoliv velikost SQLite souboru
  max_age_s: 604800 # 7 dní; při naplnění zahazuje NEJSTARŠÍ s čítačem ztrát
postgres:
  enabled: true
  host: 172.30.1.122
  port: 5432
  dbname: kotelna
  user: kotel_writer
  sslmode: prefer # verify-full pokud má server důvěryhodný certifikát
  retention_days: 90
mqtt:
  enabled: true
  host: "DOPLNTE_IP_BROKERU"
  port: 1883
  username: "DOPLNTE_MQTT_UZIVATELE"
  tls: false # podle skutečného brokeru
  ca_file: null
  prefix: kotelna/thematronic/2985
  discovery_prefix: homeassistant
  stale_s: 60

