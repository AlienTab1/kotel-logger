name: Offline collector checks
on: [push, pull_request]
jobs:
  usb-offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e './usb-logger[test]'
      - run: python -m pytest usb-logger/tests -q
      - run: sh -n usb-logger/deploy/install.sh
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-logger
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t kotel-reader:ci .
      - name: Unit and isolated integration tests
        run: docker compose -p kotel-reader-test -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from tests
      - name: Remove test services
        if: always()
        run: docker compose -p kotel-reader-test -f compose.test.yaml down -v

