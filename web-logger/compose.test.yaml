# Disposable, isolated services; no credentials for Thematronic or production services.
services:
  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./tests/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks: [test]
  exporter:
    build:
      context: .
      dockerfile: Dockerfile.test
    command: [python, -m, tests.metrics_fixture]
    networks: [test]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./tests/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    networks: [test]
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      KOTEL_INTEGRATION: "1"
    depends_on:
      - mqtt
      - exporter
      - prometheus
    networks: [test]
networks:
  test:
    internal: true

