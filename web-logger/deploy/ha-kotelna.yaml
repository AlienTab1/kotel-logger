# Manual HA card/dashboard; MQTT Discovery creates entities. Replace 2985 for another DeviceID.
title: Boiler room
views:
  - title: Boiler room
    path: kotelna
    icon: mdi:fire
    cards:
      - type: entities
        title: Boiler and availability
        show_header_toggle: false
        entities:
          - sensor.thematronic_2985_s_t_spal
          - sensor.thematronic_2985_s_t_ko_vy
          - sensor.thematronic_2985_s_t_ko_vr
          - sensor.thematronic_2985_received_at
      - type: history-graph
        title: Thermal storage
        hours_to_show: 12
        entities:
          - sensor.thematronic_2985_s_t_akuh
          - sensor.thematronic_2985_s_t_akus
          - sensor.thematronic_2985_s_t_akud
      - type: entities
        title: Zones and outdoor
        entities:
          - sensor.thematronic_2985_s_t_zo1_vy
          - sensor.thematronic_2985_s_t_zo2_vy
          - sensor.thematronic_2985_s_t_venku
      - type: markdown
        content: >-
          {% set t = states('sensor.thematronic_2985_received_at') %}
          {% if t not in ['unknown', 'unavailable'] %}
          Last received {{ (as_timestamp(now()) - as_timestamp(t)) | int }} seconds ago.
          {% else %}Telemetry is unavailable.{% endif %}
          Controller measurement freshness is unverified.

