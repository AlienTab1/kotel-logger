# Unknown signals remain in the latest diagnostic snapshot; they do not create metrics or entities.
# prometheus: true exports a numeric metric; publish: true independently enables the HA entity.
# Verify the physical meaning and polarity of booleans first.
s_t_spal:
  name: Flue gas
  type: number
  prometheus: true
  publish: true
  unit_of_measurement: °C
  device_class: temperature
  state_class: measurement
