services:
  collector:
    build: .
    image: kotel-reader:0.2.2
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./config:/config:ro
      - ${KOTEL_DATA_DIR:?Set KOTEL_DATA_DIR in .env}:/data
    ports:
      - target: 9108
        published: "${KOTEL_METRICS_PORT:-9108}"
        host_ip: ${KOTEL_METRICS_BIND_IP:?Set the NAS LAN IP in .env}
        protocol: tcp
    environment:
      THEMATRONIC_USERNAME_FILE: /run/secrets/thematronic_username
      THEMATRONIC_PASSWORD_FILE: /run/secrets/thematronic_password
      MQTT_PASSWORD_FILE: /run/secrets/mqtt_password
    secrets:
      - thematronic_username
      - thematronic_password
      - mqtt_password
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
secrets:
  thematronic_username:
    file: ${THEMATRONIC_USERNAME_SECRET:-./secrets/thematronic_username}
  thematronic_password:
    file: ${THEMATRONIC_PASSWORD_SECRET:-./secrets/thematronic_password}
  mqtt_password:
    file: ${MQTT_PASSWORD_SECRET:-./secrets/mqtt_password}
