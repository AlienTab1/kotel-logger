[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kotel-reader"
version = "0.3.0"
description = "Read-only Thematronic collector for Prometheus and Home Assistant"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
kotel-reader = "kotel_reader.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.lock"]}

[tool.setuptools.packages.find]
include = ["kotel_reader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires disposable Prometheus and MQTT", "loopback: permits local HTTP only"]
