# TrueNAS Apps → Discover Apps → Install via YAML
# Nejdříve spusťte GitHub Actions: Publish container image.
# Doplňte tag ze souhrnu workflow a VŠECHNY cesty /mnt/DOPLNTE_... .
# Vyžaduje config.yaml, signals.yaml a tři soubory secrets na hostiteli.
# Nastavte host_ip na LAN IP NASu a ověřte volný port 9108.
services:
  collector:
    image: ghcr.io/alientab1/kotel-logger:DOPLNTE_TAG_Z_ACTIONS
    pull_policy: always
    platform: linux/amd64
    user: "10001:10001"
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - target: 9108
        published: "9108"
        host_ip: DOPLNTE_LAN_IP_NASU
        protocol: tcp
    volumes:
      - type: bind
        source: /mnt/DOPLNTE_POOL/kotel-logger/config
        target: /config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/DOPLNTE_POOL/kotel-logger/data
        target: /data
        bind:
          create_host_path: false
    environment:
      THEMATRONIC_USERNAME_FILE: /run/secrets/thematronic_username
      THEMATRONIC_PASSWORD_FILE: /run/secrets/thematronic_password
      MQTT_PASSWORD_FILE: /run/secrets/mqtt_password
    secrets:
      - thematronic_username
      - thematronic_password
      - mqtt_password
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
secrets:
  thematronic_username:
    file: /mnt/DOPLNTE_POOL/kotel-logger/secrets/thematronic_username
  thematronic_password:
    file: /mnt/DOPLNTE_POOL/kotel-logger/secrets/thematronic_password
  mqtt_password:
    file: /mnt/DOPLNTE_POOL/kotel-logger/secrets/mqtt_password
