apiVersion: 1
datasources:
  - name: Kotelna PostgreSQL
    uid: kotelna-postgres
    type: postgres
    access: proxy
    url: ${KOTEL_PG_HOST}:5432
    user: kotel_grafana
    jsonData:
      database: kotelna
      sslmode: prefer
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: ${KOTEL_GRAFANA_PASSWORD}

